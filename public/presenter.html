<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck Presenter</title><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <main class="app">
      <header class="topbar"><div class="brand"><strong>Shared deck</strong><span class="badge">Presenter controls</span></div><span class="badge">Viewer link: /viewer</span></header>
      <section class="slide" aria-label="Current blank slide"></section>
      <footer class="controls"><button id="previous" aria-label="Previous slide">← Previous</button><span class="slide-count" id="slide-count">Slide 1 of 8</span><button id="next" aria-label="Next slide">Next →</button></footer>
    </main>
    <script src="/presenter.js"></script>
  </body>
</html>
